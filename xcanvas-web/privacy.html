<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XCanvas Privacy Policy</title><style>body{max-width:860px;margin:40px auto;padding:0 20px;font:16px/1.7 -apple-system,sans-serif;color:#20242b}h1{font-size:32px}h2{margin-top:32px}p,li{color:#4d5966}a{color:#6456c7}</style></head><body><main id="app"></main><script>
const zh={title:'隐私政策',date:'适用于 XCanvas - 无限画布手写笔记。更新日期：2026-07-27。',sections:[['摘要','XCanvas 是本地优先的手写导图应用。不要求账号，不销售个人信息，不投放广告，也不进行广告追踪。'],['我们处理的数据','应用在你的设备上保存你创建的手写笔迹、文本节点、画布名称、画布排列和应用设置。你主动使用 iOS 文件选择器导入或导出的文件，由系统选择器和目标服务处理；应用不会经营用于保存这些内容的服务器。'],['不收集的数据','当前版本不收集姓名、邮箱、电话号码、通讯录、精确位置、广告标识符或浏览历史；未集成广告 SDK、跨应用追踪 SDK 或自有分析服务。'],['权限与数据共享','手写导图不需要相机、照片、麦克风或通讯录权限。内容仅会在你主动导出、通过 iOS 分享面板发送，或自行启用系统 iCloud 备份/迁移时离开应用沙盒。导出后的副本受目标 App 或服务的政策约束。'],['保存与删除','数据默认保存在 App 沙盒。可在应用内删除画布；卸载 App 通常会删除本地数据。若设备启用 iCloud 备份或迁移，Apple 会按你的系统设置处理备份。请自行备份重要内容。'],['儿童与安全','本应用不以收集儿童个人信息为目的。请使用设备锁屏保护内容，并避免在公开反馈渠道提供敏感信息。'],['联系我们','隐私问题或删除请求请通过支持页面提交。'] ]};
const en={title:'Privacy Policy',date:'For XCanvas - Infinite Canvas Handwritten Notes. Updated July 27, 2026.',sections:[['Summary','XCanvas is a local-first handwritten mind-map app. It requires no account, does not sell personal information, serve ads, or use advertising tracking.'],['Data We Handle','The app stores the handwriting, text nodes, map names, map arrangement, and settings that you create on your device. Files you choose to import or export through the iOS document picker are handled by that picker and any destination service; we do not operate a server for your content.'],['Data We Do Not Collect','The current version does not collect names, email addresses, phone numbers, contacts, precise location, advertising identifiers, or browsing history. It includes no advertising SDK, cross-app tracking SDK, or proprietary analytics service.'],['Permissions and Sharing','Handwritten mind maps do not require Camera, Photos, Microphone, or Contacts access. Content leaves the app sandbox only when you export or share it through iOS, or when you enable Apple system backup or migration. Exported copies are governed by the destination app or service.'],['Storage and Deletion','Data is stored in the app sandbox by default. You can delete maps in the app; uninstalling normally removes local data. If iCloud backup or device migration is enabled, Apple handles backups under your system settings. Back up important content yourself.'],['Children and Security','The app is not intended to collect children’s personal information. Protect your device with a passcode and do not include sensitive content in public support requests.'],['Contact','Use the support page for privacy questions or deletion requests.'] ]};
const d=(navigator.language||'').toLowerCase().startsWith('zh')?zh:en;document.documentElement.lang=d===zh?'zh-Hans':'en';document.title=d.title+' - XCanvas';app.innerHTML='<h1>'+d.title+'</h1><p>'+d.date+'</p>'+d.sections.map(s=>'<h2>'+s[0]+'</h2><p>'+s[1]+'</p>').join('')+'<p><a href="index.html">XCanvas</a> · <a href="support.html">Support</a></p>';
</script></body></html>
