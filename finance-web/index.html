<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>睿账云财税 - 代账·申报·票据</title>
  <style>
    :root { color-scheme: light; --ink: #172026; --muted: #5f6b73; --line: #d9e0e4; --paper: #fbfcfb; --accent: #2b56ea; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 16px/1.7 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: var(--ink); background: var(--paper); }
    main { max-width: 980px; margin: 0 auto; padding: 48px 20px 72px; }
    h1 { margin: 0 0 12px; font-size: clamp(34px, 6vw, 56px); line-height: 1.08; letter-spacing: 0; }
    h2 { margin: 40px 0 12px; font-size: 24px; line-height: 1.25; }
    p { margin: 0 0 16px; color: var(--muted); }
    a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 3px; }
    .lead { max-width: 760px; font-size: 19px; color: #324047; }
    .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); margin-top: 30px; }
    .card { display: block; min-height: 112px; padding: 18px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: inherit; text-decoration: none; }
    .card strong { display: block; margin-bottom: 8px; font-size: 18px; }
    .card span { color: var(--muted); }
    .features { columns: 2 280px; padding-left: 20px; color: #35424a; }
    .features li { margin: 0 0 8px; break-inside: avoid; }
    .meta { margin-top: 36px; font-size: 14px; color: #71808a; }
  </style>
</head>
<body>
  <main id="app"></main>
  <script>
    const ZH = {
      title: '睿账云财税',
      lead1: '睿账云财税是一款面向代账机构与企业的财税服务应用，帮助你把记账、申报与票据管理放在同一个高效工作台里。',
      lead2: '睿账云财税提供首页看板、票据管理、纳税申报、税企服务、财务报表、资料文档与企业账套管理等功能。',
      cards: [
        { h: '隐私政策', d: '了解睿账云财税如何收集、使用和保护你的个人信息。', u: './privacy.html' },
        { h: '支持与联系', d: '查看常见问题、反馈渠道和提交问题时需要提供的信息。', u: './support.html' },
        { h: '用户协议', d: '了解睿账云财税的使用规则、责任范围和用户内容说明。', u: './terms.html' }
      ],
      featuresTitle: '主要功能',
      features: [
        '首页看板：待办、本期申报、本年税额一目了然',
        '票据管理：发票与票据的采集、查验与归档',
        '纳税申报：企业所得税、增值税申报与提醒',
        '税企服务：办税人员、税务资料与税企协同',
        '财务报表：资产负债表、利润表在线查询',
        '资料文档：企业资料、政策文档在线查看',
        '企业切换：多企业、多账套集中管理',
        '审批协作：办税流程审批与操作日志留痕'
      ],
      updated: '最后更新：2026-09-02'
    }
    const EN = Object.assign({}, ZH)
    const isZh = /^zh/i.test(navigator.language || '')
    const c = isZh ? ZH : EN
    document.documentElement.lang = isZh ? 'zh-CN' : 'en'
    document.title = c.title
    document.getElementById('app').innerHTML = `
      <h1>${c.title}</h1>
      <p class="lead">${c.lead1}</p>
      <p class="lead">${c.lead2}</p>
      <div class="grid" aria-label="重要页面">
        ${c.cards.map(x => `<a class="card" href="${x.u}"><strong>${x.h}</strong><span>${x.d}</span></a>`).join('')}
      </div>
      <h2>${c.featuresTitle}</h2>
      <ul class="features">${c.features.map(x => `<li>${x}</li>`).join('')}</ul>
      <p class="meta">${c.updated}</p>
    `
  </script>
</body>
</html>
