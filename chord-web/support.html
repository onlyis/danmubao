<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>支持与联系 - 乐谱社区</title>
  <style>
    :root { color-scheme: light; --ink: #172026; --muted: #53616a; --line: #d9e0e4; --paper: #fbfcfb; --accent: #c5a572; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 16px/1.75 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: var(--ink); background: var(--paper); }
    main { max-width: 900px; margin: 0 auto; padding: 42px 20px 76px; }
    h1 { margin: 0 0 10px; font-size: 34px; line-height: 1.16; }
    h2 { margin: 34px 0 10px; font-size: 22px; }
    p, li { color: var(--muted); }
    p { margin: 0 0 13px; }
    ul { margin: 0 0 14px 20px; padding: 0; }
    li { margin-bottom: 8px; }
    a { color: var(--accent); text-underline-offset: 3px; }
    .box { padding: 16px 18px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
    .muted { font-size: 14px; color: #71808a; }
  </style>
</head>
<body>
  <main id="app"></main>
  <script>
    const ZH = {
      title: '支持与联系',
      subtitle: '适用于乐谱社区 / Yuepu Community。最后更新：2026-09-02',
      intro: '如果你在使用乐谱社区的曲谱浏览、练习、社区、收藏或会员等功能时遇到问题，可以通过以下方式联系我们：',
      email: '邮箱：john@smartnote.ai',
      issuesTitle: '提交反馈',
      issuesDesc: '你也可以通过 GitHub Issues 提交问题或建议：',
      issuesLink: 'https://github.com/onlyis/danmubao/issues',
      issuesBtn: '打开 GitHub Issues',
      provideTitle: '反馈时请提供',
      provide: [
        '设备型号，例如 iPhone 15 Pro。',
        'iOS 或 iPadOS 版本。',
        '乐谱社区版本号。',
        '问题发生的功能区域，例如曲谱、练习、社区、收藏或会员。',
        '可复现步骤、预期结果和实际结果。',
        '如需上传截图，请先遮盖个人信息或其他敏感内容。'
      ],
      faqTitle: '常见问题',
      faq: [
        ['如何登录？', '注册账号后登录，演示账号为 deerpiano / password。'],
        ['会员有什么权益？', '会员可享受全部曲谱免费下载、无限看谱与高级练习功能，可在“我的-开通谱 Pro”查看。'],
        ['如何练习？', '进入曲谱详情后可使用移调、变速与节拍器功能跟谱练习。'],
        ['如何保护隐私？', '不要在公开反馈渠道上传原始个人信息或敏感截图。'],
        ['如何注销账号？', '请联系支持邮箱或通过支持页面提交注销申请，我们会在核验后处理。']
      ],
      back: '返回首页'
    }
    const EN = Object.assign({}, ZH)
    const isZh = /^zh/i.test(navigator.language || '')
    const c = isZh ? ZH : EN
    document.documentElement.lang = isZh ? 'zh-CN' : 'en'
    document.title = c.title + ' - 乐谱社区'
    document.getElementById('app').innerHTML = `
      <h1>${c.title}</h1>
      <p class="muted">${c.subtitle}</p>
      <div class="box">
        <p>${c.intro}</p>
        <p>${c.email}</p>
      </div>
      <h2>${c.issuesTitle}</h2>
      <p>${c.issuesDesc}</p>
      <p><a href="${c.issuesLink}">${c.issuesBtn}</a></p>
      <h2>${c.provideTitle}</h2>
      <ul>${c.provide.map(x => `<li>${x}</li>`).join('')}</ul>
      <h2>${c.faqTitle}</h2>
      ${c.faq.map(([q, a]) => `<p><strong>${q}</strong><br>${a}</p>`).join('')}
      <p><a href="./index.html">${c.back}</a></p>
    `
  </script>
</body>
</html>
