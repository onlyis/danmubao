<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>支持与联系 - 达人邦</title>
  <style>
    :root { color-scheme: light; --ink: #172026; --muted: #53616a; --line: #d9e0e4; --paper: #fbfcfb; --accent: #1677ff; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 16px/1.75 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: var(--ink); background: var(--paper); }
    main { max-width: 900px; margin: 0 auto; padding: 42px 20px 76px; }
    h1 { margin: 0 0 10px; font-size: 34px; line-height: 1.16; }
    h2 { margin: 34px 0 10px; font-size: 22px; }
    p, li { color: var(--muted); }
    p { margin: 0 0 13px; }
    ul { margin: 0 0 14px 20px; padding: 0; }
    li { margin-bottom: 8px; }
    a { color: var(--accent); text-underline-offset: 3px; }
    .box { padding: 16px 18px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
    .muted { font-size: 14px; color: #71808a; }
  </style>
</head>
<body>
  <main id="app"></main>
  <script>
    const ZH = {
      title: '支持与联系',
      subtitle: '适用于达人邦 / Darenbang。最后更新：2026-09-02',
      intro: '如果你在使用达人邦的找达人、接单、发布任务、订单、消息或钱包等功能时遇到问题，可以通过以下方式联系我们：',
      email: '邮箱：john@smartnote.ai',
      issuesTitle: '提交反馈',
      issuesDesc: '你也可以通过 GitHub Issues 提交问题或建议：',
      issuesLink: 'https://github.com/onlyis/danmubao/issues',
      issuesBtn: '打开 GitHub Issues',
      provideTitle: '反馈时请提供',
      provide: [
        '设备型号，例如 iPhone 15 Pro。',
        'iOS 或 iPadOS 版本。',
        '达人邦版本号。',
        '问题发生的功能区域，例如找达人、接单、发布、订单或钱包。',
        '可复现步骤、预期结果和实际结果。',
        '如需上传截图，请先遮盖手机号、任务内容或其他敏感信息。'
      ],
      faqTitle: '常见问题',
      faq: [
        ['如何登录？', '使用手机号获取验证码登录，未注册将自动创建账号。'],
        ['商家和达人如何切换？', '登录后可在“我的”中按身份一键切换商家端 / 达人端。'],
        ['如何发布任务？', '在商家端点击底部中央“发布”按钮，填写需求即可发布。'],
        ['如何接单？', '在达人端进入“接单大厅”，浏览任务并抢单、报价或申请。'],
        ['如何保护隐私？', '不要在公开反馈渠道上传原始手机号、支付截图或敏感任务内容。'],
        ['如何注销账号？', '请联系支持邮箱或通过支持页面提交注销申请，我们会在核验后处理。']
      ],
      back: '返回首页'
    }
    const EN = Object.assign({}, ZH)
    const isZh = /^zh/i.test(navigator.language || '')
    const c = isZh ? ZH : EN
    document.documentElement.lang = isZh ? 'zh-CN' : 'en'
    document.title = c.title + ' - 达人邦'
    document.getElementById('app').innerHTML = `
      <h1>${c.title}</h1>
      <p class="muted">${c.subtitle}</p>
      <div class="box">
        <p>${c.intro}</p>
        <p>${c.email}</p>
      </div>
      <h2>${c.issuesTitle}</h2>
      <p>${c.issuesDesc}</p>
      <p><a href="${c.issuesLink}">${c.issuesBtn}</a></p>
      <h2>${c.provideTitle}</h2>
      <ul>${c.provide.map(x => `<li>${x}</li>`).join('')}</ul>
      <h2>${c.faqTitle}</h2>
      ${c.faq.map(([q, a]) => `<p><strong>${q}</strong><br>${a}</p>`).join('')}
      <p><a href="./index.html">${c.back}</a></p>
    `
  </script>
</body>
</html>
