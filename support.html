<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Support</title>
  <style>
    body{margin:0;background:#0a0a0a;color:#eee8d8;font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{max-width:760px;margin:0 auto;padding:44px 22px}
    h1{font-size:28px;line-height:1.2}
    a{color:#ffb000}
  </style>
</head>
<body>
  <main>
    <h1 data-i18n="title">Support</h1>
    <p data-i18n="p1">For help, bug reports, purchase questions, or feature requests, open an issue on GitHub:</p>
    <p><a href="https://github.com/onlyis/danmubao/issues">https://github.com/onlyis/danmubao/issues</a></p>
  </main>
  <script>
    const zh = /^zh/i.test(navigator.language || '');
    const text = zh ? {
      title: '支持',
      p1: '如果你需要帮助、反馈问题、咨询内购或提出功能建议，请通过 GitHub Issues 联系我们：'
    } : {
      title: 'Support',
      p1: 'For help, bug reports, purchase questions, or feature requests, open an issue on GitHub:'
    };
    document.documentElement.lang = zh ? 'zh-CN' : 'en';
    document.title = text.title;
    document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = text[el.dataset.i18n]; });
  </script>
</body>
</html>
