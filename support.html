<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Support</title>
  <style>
    body{margin:0;background:#0a0a0a;color:#eee8d8;font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{max-width:840px;margin:0 auto;padding:44px 22px}
    h1{font-size:30px;line-height:1.2;margin:0 0 8px}
    h2{font-size:18px;margin:30px 0 8px;color:#ffb000}
    p,li{color:#d8d1bf}
    a{color:#ffb000}
    .muted{color:#9c9483}
  </style>
</head>
<body>
  <main id="content"></main>
  <script>
    const zh = /^zh/i.test(navigator.language || '');
    const html = zh ? `
      <h1>支持</h1>
      <p class="muted">弹幕宝（Danmu Bao / XBanner）支持页面</p>

      <h2>联系我们</h2>
      <p>如果你需要帮助、反馈问题、咨询购买、请求删除或提出功能建议，请通过 GitHub Issues 联系我们：</p>
      <p><a href="https://github.com/onlyis/danmubao/issues">https://github.com/onlyis/danmubao/issues</a></p>

      <h2>购买和恢复</h2>
      <ul>
        <li>所有 VIP 购买均由 Apple App Store 处理；</li>
        <li>如果购买后未生效，请先尝试 App 内的恢复购买；</li>
        <li>订阅可在 iOS 设置或 App Store 的 Apple ID 订阅页面管理或取消；</li>
        <li>退款请求需要通过 Apple 处理。</li>
      </ul>

      <h2>隐私和数据</h2>
      <p>App 当前不提供账号系统。保存的模板和偏好主要保存在设备本地。你可以在 App 内删除模板，或卸载 App 删除本地数据。</p>

      <h2>相关链接</h2>
      <p><a href="./privacy.html">隐私政策</a> · <a href="./terms.html">使用条款</a></p>
    ` : `
      <h1>Support</h1>
      <p class="muted">Danmu Bao (XBanner) support page</p>

      <h2>Contact</h2>
      <p>For help, bug reports, purchase questions, deletion requests, or feature requests, contact us through GitHub Issues:</p>
      <p><a href="https://github.com/onlyis/danmubao/issues">https://github.com/onlyis/danmubao/issues</a></p>

      <h2>Purchases and Restore</h2>
      <ul>
        <li>All VIP purchases are processed by Apple App Store;</li>
        <li>If a purchase is not active, try the in-app restore purchase function first;</li>
        <li>Subscriptions can be managed or cancelled in iOS Settings or the App Store Apple ID subscriptions page;</li>
        <li>Refund requests must be handled through Apple.</li>
      </ul>

      <h2>Privacy and Data</h2>
      <p>The app currently has no account system. Saved templates and preferences are mainly stored locally on your device. You can delete templates in the app or uninstall the app to remove local data.</p>

      <h2>Related Links</h2>
      <p><a href="./privacy.html">Privacy Policy</a> · <a href="./terms.html">Terms of Use</a></p>
    `;
    document.documentElement.lang = zh ? 'zh-CN' : 'en';
    document.getElementById('content').innerHTML = html;
    document.title = zh ? '支持' : 'Support';
  </script>
</body>
</html>
