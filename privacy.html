<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Privacy Policy</title>
  <style>
    body{margin:0;background:#0a0a0a;color:#eee8d8;font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{max-width:840px;margin:0 auto;padding:44px 22px}
    h1{font-size:30px;line-height:1.2;margin:0 0 8px}
    h2{font-size:18px;margin:30px 0 8px;color:#ffb000}
    p,li{color:#d8d1bf}
    a{color:#ffb000}
    .muted{color:#9c9483}
  </style>
</head>
<body>
  <main id="content"></main>
  <script>
    const zh = /^zh/i.test(navigator.language || '');
    const html = zh ? `
      <h1>隐私政策</h1>
      <p class="muted">最后更新：2026-07-04</p>
      <p>本隐私政策适用于弹幕宝（Danmu Bao / XBanner）iOS App 以及本支持网站。我们重视隐私，并尽量让 App 在设备本地运行。</p>

      <h2>1. 我们收集的数据</h2>
      <p>弹幕宝当前不要求注册账号，不收集姓名、邮箱、手机号、通讯录、照片、精确位置、广告标识符或用于跨 App 追踪的数据。</p>
      <p>App 可能在你的设备本地保存以下内容：</p>
      <ul>
        <li>你创建或保存的灯牌文字、颜色、字体、动效、背景等模板配置；</li>
        <li>语言、界面偏好和播放相关设置；</li>
        <li>Apple 通过 StoreKit 返回的购买状态，用于判断 VIP 权益是否可用。</li>
      </ul>
      <p>这些内容用于提供 App 的核心功能，并默认保存在你的设备上。</p>

      <h2>2. 购买和付款</h2>
      <p>VIP 月、季度、半年、一年订阅以及永久会员购买均通过 Apple 的 App Store 和 StoreKit 处理。我们不会接触、保存或处理你的银行卡号、支付卡信息、Apple ID 密码或账单地址。</p>
      <p>Apple 可能会向 App 返回必要的交易状态，以便 App 解锁或恢复你已购买的功能。Apple 对其处理的数据适用 Apple 的隐私政策。</p>

      <h2>3. 第三方服务</h2>
      <p>当前 App 不集成第三方广告 SDK、第三方分析 SDK，也不出售个人数据。</p>
      <p>本政策、支持页和使用条款托管在 GitHub Pages 上。访问这些网页时，GitHub 可能按照其服务运行方式处理标准的服务器日志信息，例如 IP 地址、浏览器类型和访问时间。我们不会将这些日志用于广告追踪。</p>

      <h2>4. 数据用途</h2>
      <p>我们使用本地保存的数据来：</p>
      <ul>
        <li>保存和恢复你的灯牌模板；</li>
        <li>显示你选择的语言和界面偏好；</li>
        <li>显示、购买、恢复和验证 VIP 权益；</li>
        <li>维护 App 的安全、稳定和基本功能。</li>
      </ul>

      <h2>5. 数据共享</h2>
      <p>除 Apple 处理 App Store 购买、GitHub Pages 托管网页以及法律要求外，我们不会向第三方共享个人数据。若未来引入分析、云同步、账号或其他会影响隐私的功能，我们会在发布前更新本政策，并在需要时请求你的同意。</p>

      <h2>6. 数据保留和删除</h2>
      <p>保存在设备本地的灯牌模板和偏好会一直保留，直到你在 App 内清除、卸载 App，或通过系统设置删除 App 数据。</p>
      <p>如果你希望删除与 App 使用相关的信息，可以删除本地模板、卸载 App，或通过下方联系方式联系我们。App 当前不提供账号系统，因此没有远程账号资料可删除。</p>
      <p>购买记录由 Apple 管理。你可以在 Apple ID 的购买记录或订阅设置中查看和管理相关信息。</p>

      <h2>7. 同意和权限</h2>
      <p>App 当前不请求相机、麦克风、通讯录、照片、精确位置或广告追踪权限。若未来版本需要这些权限，会在使用前通过系统权限弹窗说明用途，并在你同意后才访问。</p>

      <h2>8. 儿童隐私</h2>
      <p>弹幕宝不是专门面向儿童的 App。我们不会有意收集儿童的个人信息。如果你认为儿童向我们提供了个人信息，请联系我们，我们会按适用法律处理。</p>

      <h2>9. 国际用户和隐私权利</h2>
      <p>不同国家和地区的用户可能享有访问、更正、删除、限制处理、反对处理、撤回同意或投诉等权利。由于 App 当前不提供账号，也不维护用户资料数据库，多数数据保存在你的设备上，可由你直接删除。</p>
      <p>如需提交隐私请求，请通过 GitHub Issues 联系我们，并说明你的请求类型和所在地区。我们会在合理期限内回复。</p>

      <h2>10. 安全</h2>
      <p>我们尽量减少数据收集，并优先使用设备本地存储。请注意，没有任何电子存储或传输方式可以保证绝对安全。</p>

      <h2>11. 政策变更</h2>
      <p>如果未来功能、数据处理方式或法律要求发生变化，我们会更新本政策，并修改页面顶部的更新日期。</p>

      <h2>12. 联系我们</h2>
      <p>隐私问题、删除请求或其他支持请求：<a href="https://github.com/onlyis/danmubao/issues">https://github.com/onlyis/danmubao/issues</a></p>
      <p><a href="./terms.html">使用条款</a> · <a href="./support.html">支持</a></p>
    ` : `
      <h1>Privacy Policy</h1>
      <p class="muted">Last updated: 2026-07-04</p>
      <p>This Privacy Policy applies to the Danmu Bao (XBanner) iOS app and this support website. We value privacy and design the app to run locally on your device whenever possible.</p>

      <h2>1. Data We Collect</h2>
      <p>Danmu Bao currently does not require an account and does not collect your name, email address, phone number, contacts, photos, precise location, advertising identifier, or data used to track you across apps.</p>
      <p>The app may store the following information locally on your device:</p>
      <ul>
        <li>Banner text, colors, fonts, effects, backgrounds, and saved template settings you create;</li>
        <li>Language, interface preferences, and playback settings;</li>
        <li>Purchase status returned by Apple through StoreKit, used to determine whether VIP features are available.</li>
      </ul>
      <p>This information is used to provide the app's core features and is stored on your device by default.</p>

      <h2>2. Purchases and Payments</h2>
      <p>VIP monthly, quarterly, half-yearly, yearly subscriptions and lifetime purchases are processed by Apple through the App Store and StoreKit. We do not receive, store, or process your card number, payment card details, Apple ID password, or billing address.</p>
      <p>Apple may return transaction status information that is necessary for the app to unlock or restore purchased features. Apple's processing of that information is governed by Apple's privacy policy.</p>

      <h2>3. Third-Party Services</h2>
      <p>The app currently does not include third-party advertising SDKs or third-party analytics SDKs, and we do not sell personal data.</p>
      <p>This policy, support page, and terms page are hosted on GitHub Pages. When you visit these pages, GitHub may process standard server log information, such as IP address, browser type, and access time, as part of operating the service. We do not use those logs for advertising tracking.</p>

      <h2>4. How We Use Data</h2>
      <p>We use locally stored information to:</p>
      <ul>
        <li>Save and restore your banner templates;</li>
        <li>Display your selected language and interface preferences;</li>
        <li>Display, purchase, restore, and validate VIP access;</li>
        <li>Maintain app security, stability, and basic functionality.</li>
      </ul>

      <h2>5. Data Sharing</h2>
      <p>Except for Apple processing App Store purchases, GitHub Pages hosting these web pages, or legal requirements, we do not share personal data with third parties. If we add analytics, cloud sync, accounts, or any other feature that changes privacy handling, we will update this policy before release and request consent where required.</p>

      <h2>6. Retention and Deletion</h2>
      <p>Banner templates and preferences stored locally remain on your device until you clear them in the app, uninstall the app, or delete app data through system settings.</p>
      <p>If you want to delete information related to your use of the app, you can delete local templates, uninstall the app, or contact us using the link below. The app currently has no account system, so there is no remote account profile to delete.</p>
      <p>Purchase records are managed by Apple. You can review and manage them in your Apple ID purchase history or subscription settings.</p>

      <h2>7. Consent and Permissions</h2>
      <p>The app currently does not request access to camera, microphone, contacts, photos, precise location, or advertising tracking. If a future version needs these permissions, the app will explain the purpose in the system permission prompt and access the data only after you consent.</p>

      <h2>8. Children's Privacy</h2>
      <p>Danmu Bao is not directed to children. We do not knowingly collect personal information from children. If you believe a child has provided personal information to us, contact us and we will handle the request according to applicable law.</p>

      <h2>9. International Users and Privacy Rights</h2>
      <p>Depending on where you live, you may have rights to access, correct, delete, restrict, object to processing, withdraw consent, or lodge a complaint. Because the app currently has no account system and does not maintain a user profile database, most app data is stored on your device and can be deleted by you directly.</p>
      <p>To submit a privacy request, contact us through GitHub Issues and include the type of request and your region. We will respond within a reasonable time.</p>

      <h2>10. Security</h2>
      <p>We minimize data collection and prefer local device storage. No electronic storage or transmission method can be guaranteed to be completely secure.</p>

      <h2>11. Changes to This Policy</h2>
      <p>If features, data handling, or legal requirements change, we will update this policy and revise the date at the top of the page.</p>

      <h2>12. Contact Us</h2>
      <p>Privacy questions, deletion requests, or support requests: <a href="https://github.com/onlyis/danmubao/issues">https://github.com/onlyis/danmubao/issues</a></p>
      <p><a href="./terms.html">Terms of Use</a> · <a href="./support.html">Support</a></p>
    `;
    document.documentElement.lang = zh ? 'zh-CN' : 'en';
    document.getElementById('content').innerHTML = html;
    document.title = zh ? '隐私政策' : 'Privacy Policy';
  </script>
</body>
</html>
